<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support ticket - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/landing-professional.css" />
  </head>
  <body>
    <main class="section">
      <div class="container" style="max-width: 900px">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <div class="badge badge-glow mb-2">Vendor support</div>
            <h1 id="ticketSubject" class="h3 fw-bold mb-0">Support ticket</h1>
          </div>
          <a class="btn btn-soft" href="vendor-support.html">Back to support</a>
        </div>
        <div id="ticketError" class="alert alert-danger d-none" role="alert"></div>
        <article class="card card-glass p-4 mb-4">
          <div class="row g-3 mb-3">
            <div class="col-6 col-md-3"><div class="small text-muted-soft">Category</div><div id="ticketCategory" class="fw-semibold">—</div></div>
            <div class="col-6 col-md-3"><div class="small text-muted-soft">Status</div><div id="ticketStatus" class="fw-semibold">—</div></div>
            <div class="col-6 col-md-3"><div class="small text-muted-soft">Priority</div><div id="ticketPriority" class="fw-semibold">—</div></div>
            <div class="col-6 col-md-3"><div class="small text-muted-soft">Created</div><div id="ticketCreated" class="small">—</div></div>
          </div>
          <div class="small text-muted-soft mb-3">Last updated: <span id="ticketUpdated">—</span></div>
          <p id="ticketDescription" class="mb-3"></p>
          <div id="ticketRelated" class="d-grid gap-1 mb-3"></div>
          <div id="ticketAttachments" class="d-flex flex-wrap gap-2"></div>
          <div class="mt-3"><button id="closeTicketButton" class="btn btn-soft btn-sm d-none" type="button">Close ticket</button></div>
        </article>
        <section class="card card-glass p-4 mb-4">
          <h2 class="h5 fw-bold">Updates</h2>
          <div id="ticketUpdates" aria-live="polite"></div>
        </section>
        <form id="ticketReplyForm" class="card card-glass p-4 d-none">
          <h2 class="h5 fw-bold">Reply</h2>
          <div id="replyError" class="small text-danger mb-2" role="alert"></div>
          <label class="form-label" for="ticketReply">Message</label>
          <textarea class="form-control mb-3" id="ticketReply" rows="4" minlength="2" maxlength="5000" required></textarea>
          <label class="form-label" for="replyAttachments">Attachments (optional)</label>
          <input class="form-control" id="replyAttachments" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" multiple />
          <div class="form-text">Up to 4 image/PDF files, 5 MB each.</div>
          <div id="replyFilesHint" class="small text-muted-soft mt-1" aria-live="polite"></div>
          <div class="mt-3"><button id="sendTicketReply" class="btn btn-brand" type="submit">Send reply</button></div>
        </form>
      </div>
    </main>
    <script type="module">
      import { initVendorTicketDetails } from '../js/pages/vendor-ticket-details.js';
      initVendorTicketDetails();
    </script>
  </body>
</html>
