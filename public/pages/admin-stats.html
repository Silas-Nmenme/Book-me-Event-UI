<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Stats - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div id="toastHost" class="position-fixed top-0 end-0 p-3"></div>

    <nav class="navbar navbar-dark navbar-glass sticky-top bme-navbar">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">
          <span class="brand-pill">
            <span class="brand-dot"></span>
            <span class="fw-bold">Book Me Events</span>
          </span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navAdminStatsContent"
          aria-controls="navAdminStatsContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navAdminStatsContent" class="collapse navbar-collapse">
          <div class="ms-auto d-flex gap-2 align-items-center justify-content-end flex-wrap">
            <button
              id="themeToggleBtn"
              class="btn btn-soft bme-theme-toggle"
              type="button"
              aria-label="Toggle dark/light theme"
              title="Toggle theme"
            >
              <span data-icon="sun">☀️</span>
              <span data-icon="moon">🌙</span>
            </button>

            <button class="btn btn-soft" id="btnLogout" type="button">Logout</button>
          </div>
        </div>
      </div>
    </nav>


    <section class="section">
      <div class="container">
        <div class="row g-4 align-items-start">
          <div class="col-12 col-lg-4">
            <div class="card card-glass p-4 fade-slide">
              <div class="badge badge-glow mb-3">Admin</div>
              <h2 class="h5 fw-bold mb-1" id="meName">—</h2>
              <div class="text-muted-soft" id="meEmail">—</div>
              <hr />

              <div class="d-flex gap-3 align-items-center">
                <div id="avatar" class="rounded-circle border bme-avatar">BME</div>
                <div>
                  <div class="small text-muted-soft">Role</div>
                  <div class="fw-bold" id="meRole">ADMIN</div>
                </div>
              </div>

              <div class="mt-4 d-grid gap-2">
                <a class="btn btn-soft" href="admin-dashboard.html">Back to dashboard</a>
                <a class="btn btn-soft" href="admin-bookings.html">Bookings</a>
                <a class="btn btn-soft" href="admin-payments.html">Payments</a>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-8">
            <div class="card card-glass p-4 fade-slide bme-chat-panel">
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                  <div class="badge badge-glow text-white mb-2">Platform</div>
                  <h3 class="h5 fw-bold mb-0">Deep statistics</h3>
                </div>
                <div class="d-flex gap-2 align-items-center">
                  <button id="btnRefreshStats" class="btn btn-soft btn-sm" type="button">Refresh</button>
                </div>
              </div>

              <div id="authzError" class="alert alert-danger d-none" role="alert"></div>
              <div id="loadingStats" class="text-muted-soft small">Loading…</div>
              <div id="errorStats" class="text-danger small d-none"></div>

              <div id="statsShell" class="d-none">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardBookingsByStatus" data-detail="bookingsByStatus">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Bookings by status</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="bookingsByStatusSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>

                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardPaymentsByStatus" data-detail="paymentsByStatus">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Payments by status</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="paymentsByStatusSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>

                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardTopVendors" data-detail="topVendors">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Top vendors</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="topVendorsSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>

                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardMonthlyRevenue" data-detail="monthlyRevenue">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Monthly revenue</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="monthlyRevenueSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>

                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardMonthlySignups" data-detail="monthlySignups">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Monthly signups</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="monthlySignupsSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>

                  <div class="col-12 col-md-6">
                    <button type="button" class="card card-glass p-3 w-100 text-start bme-stat-click" id="cardMonthlyBookings" data-detail="monthlyBookings">
                      <div class="d-flex align-items-center justify-content-between">
                        <div class="fw-bold mb-1">Monthly bookings</div>
                        <span class="text-muted-soft small">View details →</span>
                      </div>
                      <div id="monthlyBookingsSummary" class="small text-muted-soft">—</div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div>© <span id="year"></span> Book Me Events</div>
          <div class="text-muted-soft small">Admin stats</div>
        </div>
      </div>
    </footer>

    <div class="modal fade" id="statDetailModal" tabindex="-1" aria-labelledby="statDetailModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="statDetailModalLabel">Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="statDetailModalBody">
            <div class="text-muted-soft small">Loading…</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
      import { fetchMe, logoutUser, clearToken, getAdminStats } from '../js/api.js';
      import { toast, setYear } from '../js/ui.js';
      import { initThemeToggle } from '../js/theme-toggle.js';
      import { initNavbarBrandRoleRedirect } from '../js/role-redirect.js';

      setYear('year');
      initThemeToggle();
      initNavbarBrandRoleRedirect();


      const avatarEl = document.getElementById('avatar');
      const authzErrorEl = document.getElementById('authzError');

      function setAvatarUrl(url) {
        if (!avatarEl) return;
        if (url) {
          avatarEl.style.backgroundImage = `url(${url})`;
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          avatarEl.textContent = '';
          avatarEl.style.fontWeight = 'normal';
          return;
        }
        avatarEl.textContent = 'BME';
        avatarEl.style.backgroundImage = '';
        avatarEl.style.background = 'rgba(124,58,237,0.12)';
      }

      function escapeHtml(s) {
        return (s ?? '').toString().replace(/[&<>"']/g, (c) => {
          const m = { '&': '&amp;', '<': '<', '>': '>', '"': '"', "'": '&#039;' };
          return m[c] || c;
        });
      }

      function fmtAmount(n) {
        const num = Number(n);
        if (!Number.isFinite(num)) return '—';
        return `₦${num.toLocaleString()}`;
      }

      document.getElementById('btnLogout').addEventListener('click', async () => {
        try { await logoutUser(); } finally { clearToken(); }
        toast({ title: 'Logged out', message: 'See you again.', variant: 'success' });
        window.location.replace('auth-login.html');
      });

      async function loadMe() {
        const res = await fetchMe();
        const me = res?.data || res;
        const role = (me?.role || me?.user?.role || '').toString().toUpperCase();

        document.getElementById('meName').textContent = me?.firstName
          ? `${me.firstName} ${me.lastName || ''}`.trim()
          : me?.name || '—';
        document.getElementById('meEmail').textContent = me?.email || '—';
        document.getElementById('meRole').textContent = role || 'ADMIN';

        if (me?.profilePicture) setAvatarUrl(me.profilePicture);
        else setAvatarUrl(null);

        if (role !== 'ADMIN') {
          authzErrorEl.classList.remove('d-none');
          authzErrorEl.textContent = 'Admin access required.';
          throw new Error('Forbidden');
        }

        return me;
      }

      function renderArrays(list, renderItem) {
        if (!Array.isArray(list) || list.length === 0) return '—';
        return list.map(renderItem).join('');
      }

      // Holds the last-loaded stats payload so the detail modal can render the full table on click.
      let lastStatsData = null;

      const detailConfig = {
        bookingsByStatus: {
          title: 'Bookings by status',
          columns: ['Status', 'Count'],
          rows: (data) => (data?.bookingsByStatus || []).map((x) => [x?._id || '—', x?.count ?? 0]),
        },
        paymentsByStatus: {
          title: 'Payments by status',
          columns: ['Status', 'Count', 'Total amount'],
          rows: (data) => (data?.paymentsByStatus || []).map((x) => [x?._id || '—', x?.count ?? 0, fmtAmount(x?.total)]),
        },
        topVendors: {
          title: 'Top vendors',
          columns: ['Vendor', 'Bookings', 'Revenue'],
          rows: (data) =>
            (data?.topVendors || []).map((x) => {
              const vendorInfo = Array.isArray(x?.vendorInfo) ? x.vendorInfo[0] : null;
              const vendorName = vendorInfo?.businessName || vendorInfo?.name || x?._id || '—';
              return [vendorName, x?.count ?? 0, fmtAmount(x?.revenue)];
            }),
        },
        monthlyRevenue: {
          title: 'Monthly revenue',
          columns: ['Month', 'Revenue', 'Payments'],
          rows: (data) => (data?.monthlyRevenue || []).map((x) => [x?._id || '—', fmtAmount(x?.total), x?.count ?? 0]),
        },
        monthlySignups: {
          title: 'Monthly signups',
          columns: ['Month', 'New users'],
          rows: (data) => (data?.monthlySignups || []).map((x) => [x?._id || '—', x?.count ?? 0]),
        },
        monthlyBookings: {
          title: 'Monthly bookings',
          columns: ['Month', 'Bookings'],
          rows: (data) => (data?.monthlyBookings || []).map((x) => [x?._id || '—', x?.count ?? 0]),
        },
      };

      function renderSummary(elId, list, formatItem) {
        const el = document.getElementById(elId);
        if (!el) return;
        if (!Array.isArray(list) || list.length === 0) {
          el.textContent = 'No data yet.';
          return;
        }
        el.textContent = `${list.length} ${list.length === 1 ? 'entry' : 'entries'} — ${formatItem(list[0])}${list.length > 1 ? ', …' : ''}`;
      }

      function openStatDetail(key) {
        const config = detailConfig[key];
        const modalEl = document.getElementById('statDetailModal');
        const titleEl = document.getElementById('statDetailModalLabel');
        const bodyEl = document.getElementById('statDetailModalBody');
        if (!config || !modalEl || !bodyEl || typeof window.bootstrap === 'undefined') return;

        titleEl.textContent = config.title;

        const rows = lastStatsData ? config.rows(lastStatsData) : [];
        if (!rows.length) {
          bodyEl.innerHTML = `<div class="text-muted-soft small">No data available.</div>`;
        } else {
          bodyEl.innerHTML = `
            <div class="table-responsive">
              <table class="table table-dark table-hover mb-0">
                <thead><tr>${config.columns.map((c) => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
                <tbody>
                  ${rows.map((r) => `<tr>${r.map((cell) => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        window.bootstrap.Modal.getOrCreateInstance(modalEl).show();
      }

      document.querySelectorAll('.bme-stat-click').forEach((btn) => {
        btn.addEventListener('click', () => openStatDetail(btn.getAttribute('data-detail')));
      });

      async function loadStats() {
        const loadingEl = document.getElementById('loadingStats');
        const errorEl = document.getElementById('errorStats');
        const shell = document.getElementById('statsShell');

        loadingEl.classList.remove('d-none');
        errorEl.classList.add('d-none');
        shell.classList.add('d-none');

        try {
          const res = await getAdminStats();
          const data = res?.data || res;
          lastStatsData = data;

          renderSummary('bookingsByStatusSummary', data?.bookingsByStatus, (x) => `${x?._id || '—'}: ${x?.count ?? 0}`);
          renderSummary('paymentsByStatusSummary', data?.paymentsByStatus, (x) => `${x?._id || '—'}: ${x?.count ?? 0} (${fmtAmount(x?.total)})`);
          renderSummary('topVendorsSummary', data?.topVendors, (x) => {
            const vendorInfo = Array.isArray(x?.vendorInfo) ? x.vendorInfo[0] : null;
            const vendorName = vendorInfo?.businessName || vendorInfo?.name || x?._id || '—';
            return `${vendorName}: ${x?.count ?? 0} bookings`;
          });
          renderSummary('monthlyRevenueSummary', data?.monthlyRevenue, (x) => `${x?._id || '—'}: ${fmtAmount(x?.total)}`);
          renderSummary('monthlySignupsSummary', data?.monthlySignups, (x) => `${x?._id || '—'}: ${x?.count ?? 0} new users`);
          renderSummary('monthlyBookingsSummary', data?.monthlyBookings, (x) => `${x?._id || '—'}: ${x?.count ?? 0} bookings`);

          shell.classList.remove('d-none');
        } catch (e) {
          errorEl.classList.remove('d-none');
          errorEl.textContent = e?.message || 'Failed to load stats.';
        } finally {
          loadingEl.classList.add('d-none');
        }
      }

      document.getElementById('btnRefreshStats').addEventListener('click', loadStats);

      await loadMe();
      await loadStats();
    </script>
  </body>
</html>
