<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/landing-professional.css" />
  </head>
  <body>
    <main class="section">
      <div class="container" style="max-width: 900px">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
          <div>
            <div class="badge badge-glow mb-2">Account activity</div>
            <h1 class="h3 fw-bold mb-0">Notifications</h1>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-soft" id="notificationsMarkAllRead" type="button">Mark all as read</button>
            <a class="btn btn-soft" id="dashboardLink" href="user-dashboard.html">Dashboard</a>
          </div>
        </div>
        <div class="small text-muted-soft mb-3"><span id="notificationUnreadCount">0</span> unread</div>
        <div id="notificationList" class="card-glass p-3" aria-live="polite"></div>
        <div id="notificationEmpty" class="small text-muted-soft py-2">No notifications yet.</div>
      </div>
    </main>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module">
      import { fetchMe, clearToken } from '../js/api.js';
      import { initNotificationCenter } from '../js/pages/notifications.js';

      try {
        const response = await fetchMe();
        const user = response?.data || response;
        const isVendor = (user?.role || user?.user?.role || '').toUpperCase() === 'VENDOR';
        document.getElementById('dashboardLink').href = isVendor ? 'vendor-dashboard.html' : 'user-dashboard.html';
        initNotificationCenter({ userId: user?._id || user?.id || user?.user?._id, limit: 50 });
      } catch {
        clearToken();
        window.location.replace('auth-login.html');
      }
    </script>
  </body>
</html>
