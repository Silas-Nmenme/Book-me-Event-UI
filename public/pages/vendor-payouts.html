<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendor Payouts - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/landing-professional.css" />
  </head>
  <body>
    <main class="section"><div class="container" style="max-width:1000px">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><div class="badge badge-glow mb-2">Vendor workspace</div><h1 class="h3 fw-bold mb-0">Payout history</h1></div><a class="btn btn-soft" href="vendor-dashboard.html">Dashboard</a></div>
      <div class="alert alert-info">Payouts are admin-controlled. The platform currently records manual transfers; a payout is shown as paid only after an administrator reconciles a bank reference and proof.</div>
      <div id="payoutError" class="alert alert-danger d-none" role="alert"></div>
      <div id="payoutList" class="d-grid gap-3" aria-live="polite"></div>
      <section id="payoutEmpty" class="card card-glass p-4 d-none"><h2 class="h5 fw-bold">No payouts yet</h2><p class="text-muted-soft mb-0">Approved service completion payouts will appear here.</p></section>
    </div></main>
    <script type="module">
      import { apiFetch, fetchMe, clearToken } from '../js/api.js';
      const list = document.getElementById('payoutList');
      const error = document.getElementById('payoutError');
      const empty = document.getElementById('payoutEmpty');
      function add(parent, tag, className, value) { const node = document.createElement(tag); node.className = className || ''; node.textContent = value || ''; parent.append(node); return node; }
      try {
        const meResponse = await fetchMe();
        const user = meResponse?.data || meResponse;
        if (user?.role !== 'VENDOR') throw new Error('Vendor access required');
        const response = await apiFetch('/api/v1/vendors/payouts?limit=50');
        const payouts = Array.isArray(response?.data) ? response.data : [];
        empty.classList.toggle('d-none', payouts.length > 0);
        for (const payout of payouts) {
          const card = document.createElement('article'); card.className = 'card card-glass p-3';
          add(card, 'h2', 'h6 fw-bold', `${payout.payoutId} · ${payout.payoutStatus.replaceAll('_', ' ')}`);
          add(card, 'div', 'small text-muted-soft', `Booking ${payout.booking?._id || payout.booking} · Gross ${payout.currency} ${Number(payout.grossAmount || 0).toLocaleString()}`);
          add(card, 'div', 'small text-muted-soft mt-1', `Net ${payout.netAmount == null ? 'Pending admin configuration' : `${payout.currency} ${Number(payout.netAmount).toLocaleString()}`} · ${payout.report?.satisfactionStatus || 'Satisfaction pending'} · ${payout.report?.adminReviewStatus || 'Review pending'}`);
          if (payout.transferReference) add(card, 'div', 'small text-success mt-2', `Manual transfer reference: ${payout.transferReference} · ${payout.transferredAt ? new Date(payout.transferredAt).toLocaleString() : ''}`);
          if (payout.payoutStatus === 'ON_HOLD') add(card, 'div', 'small text-muted-soft mt-2', 'Payout is on hold pending client/admin review and confirmed payment settlement.');
          list.append(card);
        }
      } catch (loadError) {
        if (loadError?.status === 401 || loadError?.status === 403) { clearToken(); window.location.replace('auth-login.html'); }
        else { error.textContent = loadError?.message || 'Could not load payout history.'; error.classList.remove('d-none'); }
      }
    </script>
  </body>
</html>
